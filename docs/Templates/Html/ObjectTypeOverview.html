<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <title>{Title}</title>
 <style>
 :root { --bg:#f9f9f9; --text:#222; --muted:#666; --line:#ddd; --shade:#f0f0f0; --card-bg:#fff; --warn-bg:#fff1f0; --warn-line:#ffa39e; --note-bg:#fffbe6; --note-line:#ffe58f; }
 html,body{height:100%}
 body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);margin:24px;line-height:1.45}
 h1,h2,h3{color:#333;margin-top:1.2em;margin-bottom:.5em}
 .breadcrumbs{font-size:13px;color:#555;margin-bottom:12px}
 .section-card,.toc-card{background:var(--card-bg);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:16px;margin-bottom:20px}
 table{width:100%;border-collapse:collapse;margin-top:12px}
 th,td{border:1px solid #ccc;padding:6px 8px;font-size:13px;vertical-align:top}
 th{background:var(--shade);text-align:left}
 code{font-family:Consolas,monospace;font-size:12px}
 pre{background:#fafafa;border:1px solid var(--line);padding:10px;overflow:auto}
 details{margin:10px 0} summary{cursor:pointer;font-weight:600}
 .note{background:var(--note-bg);border:1px solid var(--note-line);padding:8px 10px}
 .warn{background:var(--warn-bg);border:1px solid var(--warn-line);padding:8px 10px}
 .muted{color:var(--muted)}
 .footer{margin-top:30px;font-size:12px;color:#777;border-top:1px solid var(--line);padding-top:8px}
 </style>
</head>
<body>
 <div class="breadcrumbs">{Breadcrumbs}</div>
 <div class="section-card">
  <h1>{Title}</h1>
 </div>
 {TOC}
 <div class="section-card" id="objects">
  <h2>Objects</h2>
  {ObjectTable}
 </div>
 <div class="footer">Generated on: {Timestamp}</div>
</body>
</html>
